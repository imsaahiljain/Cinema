name: Cinema
options:
  bundleIdPrefix: com.mtgcardneeder
  deploymentTarget:
    iOS: "26.0"
  defaultConfig: Debug
  xcodeVersion: "26.5"

settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ONLY_ACTIVE_ARCH: YES
    PRODUCT_NAME: "$(TARGET_NAME)"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      GCC_OPTIMIZATION_LEVEL: "0"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE

targets:
  Cinema:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Cinema
        excludes:
          - "Resources/Preview Content"
    resources:
      - path: Cinema/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtgcardneeder.Cinema
        INFOPLIST_FILE: Cinema/Resources/Info.plist
        DEVELOPMENT_TEAM: "PXH52A4CBY"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: Supabase
    info:
      path: Cinema/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Popcorn"
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Used to set your profile photo."
        NSContactsUsageDescription: "Popcorn uses your contacts to find friends already on the app."
        UIAppFonts:
          - LibreCaslonText-Regular.ttf
          - LibreCaslonText-Bold.ttf
          - NunitoSans-Regular.ttf
          - NunitoSans-SemiBold.ttf
          - NunitoSans-Bold.ttf
    scheme:
      shared: true
      testTargets:
        - CinemaUITests
        - CinemaTests

  CinemaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CinemaTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtgcardneeder.CinemaTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Cinema

  CinemaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CinemaUITests
      - path: Cinema/Core/Network/Secrets.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtgcardneeder.CinemaUITests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Cinema

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"
